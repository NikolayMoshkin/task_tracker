syntax = "proto3";

package task_tracker_pb;

option go_package = "./task_tracker_pb";

message AddRequest {
    string name = 1;
}

message AddResponse {
    string result = 1;
}

message ListRequest {
    string status = 1;
}

message ListResponse {
    string tasks = 1;
}

service TaskTrackerService{
    rpc Add(AddRequest) returns (AddResponse);
    rpc List(ListRequest) returns (ListResponse);
}